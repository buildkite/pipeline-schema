checkout:
  skip: true
  depth: 50
  submodules: false
  commit_verification: "strict"

steps:
  - command: test

  - command: test
    checkout:
      skip: false

  - command: test
    checkout: {}

  - command: test
    checkout:
      depth: 10

  - command: test
    checkout:
      commit_verification: "strict"

  - command: test
    checkout:
      commit_verification: "warn"

  - command: test
    checkout:
      skip: false
      commit_verification: "strict"

  - command: test
    checkout:
      depth: 10
      commit_verification: "strict"

  - command: test
    checkout:
      submodules: true

  - command: test
    checkout:
      submodules: false

  - command: test
    checkout:
      submodules: true
      depth: 10
      commit_verification: "strict"
