checkout:
  skip: true
  depth: 50
  commit_verification: "strict"
  flags:
    clone: "--depth 1 --single-branch"
    fetch: "--prune --tags"
    checkout: "--force"
    clean: "-fxd"

steps:
  - command: test

  - command: test
    checkout:
      skip: false

  - command: test
    checkout: {}

  - command: test
    checkout:
      depth: 10

  - command: test
    checkout:
      commit_verification: "strict"

  - command: test
    checkout:
      commit_verification: "warn"

  - command: test
    checkout:
      skip: false
      commit_verification: "strict" 

  - command: test
    checkout:
      depth: 10
      commit_verification: "strict"
      ssh_secret: "github-readonly"

  - command: test
    checkout:
      flags:
        clone: "--depth 1"
        clean: ""

  - command: test
    checkout:
      ssh_secret: "github-readonly"
