steps:
  - name: ":go: Go tests"
    command: go test ./...
    plugins:
      - docker-compose#v4.16.0:
          config: test/docker-compose.yml
          run: go-tests

  - name: ":mocha: Schema tests"
    command: npm test && npm run format:check
    plugins:
      - docker-compose#v4.16.0:
          config: test/docker-compose.yml
          run: tests
